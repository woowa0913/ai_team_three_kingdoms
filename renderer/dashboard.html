<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Orchestra - 대시보드</title>
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- 헤더 영역 -->
        <header class="header">
            <div class="header-info">
                <div class="agent-emoji" data-agent-emoji>🪭</div>
                <div class="agent-name-wrap">
                    <div class="agent-switcher">
                        <div class="agent-name" data-agent-name>로딩 중...</div>
                        <button type="button" class="btn-agent-switch" id="btn-agent-switch" title="에이전트 전환">▼</button>
                    </div>
                    <div class="model-name" data-agent-model>모델 정보 불러오는 중...</div>
                    <ul class="agent-switcher-dropdown" id="agent-switcher-dropdown" hidden></ul>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn btn-clear" title="대화 초기화">🗑️</button>
                <button class="icon-btn btn-close" title="닫기">❌</button>
            </div>
        </header>

        <!-- API 키 미설정 경고 배너 -->
        <div class="api-key-warning" id="api-key-warning" style="display:none">
            ⚠️ API 키가 설정되지 않았습니다.
            <button class="btn-open-settings">설정 열기 →</button>
        </div>

        <!-- 탭 바 -->
        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="chat">💬 채팅</button>
            <button class="tab-btn" data-tab="persona">🎭 페르소나</button>
            <button class="tab-btn" data-tab="skills">⚡ 능력/스킬</button>
        </nav>

        <!-- 채팅 탭 (기존 .chat-messages + 입력창을 이 div 안에 감쌈) -->
        <div class="tab-content active" id="tab-chat">
            <!-- 채팅 메시지 영역 -->
            <main class="chat-messages" id="chat-messages">
                <!-- dashboard.js가 동적으로 메시지 삽입 예정 -->
            </main>

            <!-- 입력 영역 -->
            <footer class="input-container">
                <textarea class="message-input" id="message-input" placeholder="지시를 내려주시옵소서... (Shift+Enter로 줄바꿈)"
                    rows="1"></textarea>

                <button class="btn-send" id="btn-send" disabled title="메시지 전송">
                    <!-- 종이비행기/전송 아이콘 SVG -->
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </footer>
        </div>

        <!-- 페르소나 탭 -->
        <div class="tab-content" id="tab-persona">
            <div class="persona-view">
                <div class="persona-header">
                    <span class="persona-name" id="persona-name"></span>
                    <button class="btn-edit-persona" id="btn-edit-persona">✏️ 편집</button>
                </div>

                <div class="persona-readonly" id="persona-readonly">
                    <p class="persona-desc" id="persona-desc"></p>
                </div>

                <div class="persona-edit" id="persona-edit" hidden>
                    <textarea class="persona-textarea" id="persona-textarea"></textarea>
                    <div class="persona-actions">
                        <button class="btn-ai-help" id="btn-ai-help">🪭 AI와 함께 수정</button>
                        <button class="btn-save-persona" id="btn-save-persona">저장</button>
                        <button class="btn-cancel-persona" id="btn-cancel-persona">취소</button>
                    </div>

                    <div class="ai-help-panel" id="ai-help-panel" hidden>
                        <div class="ai-help-title">🪭 제갈량에게 지시하기</div>
                        <div class="ai-help-input-row">
                            <input type="text" class="ai-help-input" id="ai-help-input" placeholder="이 에이전트가 더 창의적이면 좋겠어">
                            <button class="btn-ai-send" id="btn-ai-send">▶</button>
                        </div>
                        <div class="ai-help-response" id="ai-help-response"></div>
                        <div class="ai-help-footer">
                            <button class="btn-apply-suggestion" id="btn-apply-suggestion" disabled>이 제안 적용</button>
                            <button class="btn-close-ai-help" id="btn-close-ai-help">닫기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 능력/스킬 탭 -->
        <div class="tab-content" id="tab-skills">
            <div class="skills-view">
                <div class="skill-tag" id="expertise-text"></div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
